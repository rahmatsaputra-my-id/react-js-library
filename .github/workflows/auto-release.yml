name: Auto Release & Publish to npm

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Configure git user
        run: |
          git config --global user.name "rahmatsaputra"
          git config --global user.email "rahmatsaputra@users.noreply.github.com"

      - name: Auto bump version
        run: npx standard-version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Authenticate git with PAT
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Push new version & tags
        run: git push --follow-tags origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build library (Rollup)
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
